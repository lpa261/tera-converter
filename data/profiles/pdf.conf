[Profile]
Category=document
Name=PDF Document Converter
MimeTypes=application/pdf;
Extensions=pdf;

[Target:docx]
Label=Word Document (.docx)
Engine=teraconvert-doc
Command=teraconvert-doc docx {input} {output}

[Target:png]
Label=PNG Images (Each Page)
Engine=teraconvert-doc
Command=teraconvert-doc png {input} {output}

[Target:jpg]
Label=JPG Images (Each Page)
Engine=teraconvert-doc
Command=teraconvert-doc jpg {input} {output}

[Target:txt]
Label=Plain Text (.txt)
Engine=teraconvert-doc
Command=teraconvert-doc txt {input} {output}

[Target:html]
Label=HTML Webpage (.html)
Engine=pdftohtml
Command=pdftohtml -s -c -noframes {input} {output}
