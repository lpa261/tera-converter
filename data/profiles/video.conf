[Profile]
Category=media
Name=Audio & Video Converter
MimeTypes=video/mp4;video/x-matroska;video/webm;video/x-msvideo;video/quicktime;video/x-flv;audio/mpeg;audio/wav;audio/x-wav;audio/flac;audio/aac;audio/ogg;audio/x-m4a;audio/mp4;
Extensions=mp4;mkv;webm;avi;mov;flv;wmv;mp3;wav;flac;aac;ogg;m4a;opus;

[Target:mp4]
Label=MP4 Video (H.264/AAC)
Engine=ffmpeg
Command=ffmpeg -y -i {input} -c:v libx264 -preset fast -c:a aac -movflags +faststart {output}

[Target:mkv]
Label=MKV Video
Engine=ffmpeg
Command=ffmpeg -y -i {input} -c copy {output}

[Target:webm]
Label=WEBM Video
Engine=ffmpeg
Command=ffmpeg -y -i {input} -c:v libvpx-vp9 -b:v 0 -crf 32 -deadline realtime -cpu-used 4 -row-mt 1 -c:a libopus {output}

[Target:mp3]
Label=MP3 Audio (320kbps)
Engine=ffmpeg
Command=ffmpeg -y -i {input} -vn -c:a libmp3lame -b:a 320k {output}

[Target:wav]
Label=WAV Lossless Audio
Engine=ffmpeg
Command=ffmpeg -y -i {input} -vn -c:a pcm_s16le {output}

[Target:flac]
Label=FLAC Lossless Audio
Engine=ffmpeg
Command=ffmpeg -y -i {input} -vn -c:a flac {output}

[Target:m4a]
Label=M4A Audio
Engine=ffmpeg
Command=ffmpeg -y -i {input} -vn -c:a aac -b:a 256k {output}

[Target:gif]
Label=Animated GIF (Clip 15s)
Engine=ffmpeg
Command=ffmpeg -y -ss 00:00:00 -i {input} -t 15 -vf fps=12,scale=480:-1:flags=lanczos {output}
