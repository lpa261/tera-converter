[Profile]
Category=document
Name=Office Document Converter
MimeTypes=application/msword;application/vnd.openxmlformats-officedocument.wordprocessingml.document;application/vnd.oasis.opendocument.text;application/vnd.ms-excel;application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;application/vnd.ms-powerpoint;application/vnd.openxmlformats-officedocument.presentationml.presentation;text/plain;text/markdown;text/html;text/rtf;
Extensions=docx;doc;odt;rtf;xlsx;xls;ods;csv;pptx;ppt;odp;txt;md;html;

[Target:pdf]
Label=PDF Document
Engine=teraconvert-doc
Command=teraconvert-doc pdf {input} {output}

[Target:docx]
Label=DOCX Word Document
Engine=teraconvert-doc
Command=teraconvert-doc docx {input} {output}

[Target:odt]
Label=ODT OpenDocument Text
Engine=teraconvert-doc
Command=teraconvert-doc odt {input} {output}

[Target:txt]
Label=Plain Text (TXT)
Engine=teraconvert-doc
Command=teraconvert-doc txt {input} {output}
