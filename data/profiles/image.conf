[Profile]
Category=image
Name=Image Converter
MimeTypes=image/png;image/jpeg;image/webp;image/gif;image/bmp;image/tiff;image/svg+xml;image/x-icon;
Extensions=png;jpg;jpeg;webp;gif;bmp;tiff;svg;ico;

[Target:png]
Label=PNG Image
Engine=teraconvert-img
Command=teraconvert-img png {input} {output}

[Target:jpg]
Label=JPG Image
Engine=teraconvert-img
Command=teraconvert-img jpg {input} {output}

[Target:webp]
Label=WEBP Image
Engine=teraconvert-img
Command=teraconvert-img webp {input} {output}

[Target:gif]
Label=GIF Image
Engine=teraconvert-img
Command=teraconvert-img gif {input} {output}

[Target:bmp]
Label=BMP Bitmap
Engine=teraconvert-img
Command=teraconvert-img bmp {input} {output}

[Target:ico]
Label=ICO Favicon
Engine=teraconvert-img
Command=teraconvert-img ico {input} {output}

[Target:pdf]
Label=PDF Document
Engine=img2pdf
Command=img2pdf --output {output} {input}
SupportMerge=true
MergeCommand=img2pdf --output {output} {inputs}
